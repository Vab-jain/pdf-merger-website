<!DOCTYPE html>
<html>
<head>
    <title>PDF Merger</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/pyodide/v0.25.0/full/pyodide.js"></script>
</head>
<body>
    <div class="container">
        <h1>PDF Merger</h1>
        <p>Select multiple PDF files to merge them into a single document.</p>
        
        <input type="file" id="fileInput" multiple accept=".pdf">
        
        <ul id="fileList" style="list-style-type: none; padding: 0;"></ul>
        
        <button onclick="mergePdfs()">Merge PDFs</button>
        <div id="status"></div>
        <br>
        <a id="downloadLink" style="display: none;">Download Merged PDF</a>
    </div>
    <script>
        // 1. Create a global array to store the files (since the default FileList is immutable)
        let selectedFilesArray = [];
        let draggedItemIndex = null; // Tracks the index of the item currently being dragged

        // 2. Listen for the 'change' event on the file input
        document.getElementById('fileInput').addEventListener('change', function(event) {
            // Convert the read-only FileList into a standard JavaScript array
            selectedFilesArray = Array.from(event.target.files);
            renderFileList();
        });

        // 3. Render the array to the DOM
        function renderFileList() {
            const listContainer = document.getElementById('fileList');
            listContainer.innerHTML = ''; // Clear the current list before re-rendering

            selectedFilesArray.forEach((file, index) => {
                const listItem = document.createElement('li');
                listItem.classList.add('file-item');
                listItem.draggable = true;
                listItem.dataset.index = index;

                // 1. Create the drag handle
                const dragHandle = document.createElement('span');
                dragHandle.innerHTML = '&#9776;'; // Unicode for the three horizontal bars
                dragHandle.classList.add('drag-handle');

                // 2. Add the handle and the file name to the list item
                listItem.appendChild(dragHandle);
                listItem.appendChild(document.createTextNode(file.name));

                // Attach drag-and-drop event listeners
                listItem.addEventListener('dragstart', handleDragStart);
                listItem.addEventListener('dragover', handleDragOver);
                listItem.addEventListener('drop', handleDrop);
                listItem.addEventListener('dragenter', (e) => e.preventDefault()); // Also needed to allow dropping

                listContainer.appendChild(listItem);
            });
        }

        function handleDragStart(event) {
            // Store the index of the item we just picked up
            draggedItemIndex = parseInt(event.target.dataset.index);
            // Optional: Make the dragged item slightly transparent
            event.target.style.opacity = '0.5'; 
        }

        function handleDragOver(event) {
            // By default, HTML prevents dropping elements. We must prevent this default behavior.
            event.preventDefault(); 
        }

        function handleDrop(event) {
            event.preventDefault();
            
            // Get the index of the item we are dropping *onto*
            const targetIndex = parseInt(event.target.dataset.index);

            // If we have a valid drag and drop, and we aren't dropping the item on itself
            if (draggedItemIndex !== null && !isNaN(targetIndex) && draggedItemIndex !== targetIndex) {
                
                // 1. Remove the dragged item from its original position in the array
                const [draggedFile] = selectedFilesArray.splice(draggedItemIndex, 1);
                
                // 2. Insert it into the new position
                selectedFilesArray.splice(targetIndex, 0, draggedFile);

                // 3. Re-render the UI to reflect the newly sorted array
                renderFileList();
            }
            
            draggedItemIndex = null; // Reset the tracker
        }

        async function mergePdfs() {
            // Display a status message
            const statusEl = document.getElementById('status');
            statusEl.textContent = 'Loading Python environment...';

            // Reset state for a new merge
            statusEl.textContent = '';
            downloadLink.style.display = 'none';
            downloadLink.classList.remove('ready-for-download'); // Remove the class from a previous run


            // 1. Load Pyodide and the pypdf library
            let pyodide = await loadPyodide();
            statusEl.textContent = 'Loading pypdf...';
            await pyodide.loadPackage("micropip");
            await pyodide.runPythonAsync(`
                import micropip
                await micropip.install('pypdf')
            `);

            // 2. Get the files from the HTML input
            const files = selectedFilesArray;
            if (files.length === 0) {
                statusEl.textContent = 'Please select at least one PDF file.';
                return;
            }

            statusEl.textContent = 'Merging PDFs...';
            
            // 3. Write files to Pyodide's virtual file system
            const fileNames = [];
            for (const file of files) {
                const data = await file.arrayBuffer();
                const uint8Array = new Uint8Array(data);
                pyodide.FS.writeFile(file.name, uint8Array);
                fileNames.push(file.name);
            }

            // 4. Run the Python script to merge the files
            const mergedFileName = 'merged.pdf';
            await pyodide.runPythonAsync(`
                from pypdf import PdfWriter
                import os

                merger = PdfWriter()
                
                # The files are now available in the virtual file system
                input_files = ${JSON.stringify(fileNames)};

                for filename in input_files:
                    merger.append(filename)

                merger.write("${mergedFileName}")
                merger.close()
            `);

            // 5. Read the merged file from the virtual file system
            const mergedPdfData = pyodide.FS.readFile(mergedFileName, { encoding: 'binary' });

            // 6. Create a Blob and a download link for the user
            const blob = new Blob([mergedPdfData], { type: 'application/pdf' });
            const url = URL.createObjectURL(blob);
            
            downloadLink.href = url;
            downloadLink.download = mergedFileName;
            downloadLink.style.display = 'inline';
            
            // Add the CSS class to trigger the animation
            downloadLink.classList.add('ready-for-download');
            
            statusEl.textContent = 'Merge successful!';
        }
    </script>
</body>
</html>
